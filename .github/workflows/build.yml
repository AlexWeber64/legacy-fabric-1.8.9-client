name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The mod compiles against AxolotlClient, whose jars are not in this repository (see "Building" in the README).
      # Download the 3.0.6+1.8.9 release from Modrinth, check it is the exact file, and unpack the jars nested in it.
      - name: Get the AxolotlClient jars to compile against
        run: |
          mkdir -p libs
          curl -fsSL -o "libs/AxolotlClient-3.0.6+1.8.9.jar" \
            "https://cdn.modrinth.com/data/p2rxzX0q/versions/EpBQmzkD/AxolotlClient-3.0.6%2B1.8.9.jar"
          echo "4452c6b34cb4ea89c714d087ca81db4571086cdfe4d9f53da3d389bac74047d3  libs/AxolotlClient-3.0.6+1.8.9.jar" \
            | sha256sum -c -
          unzip -j -o "libs/AxolotlClient-3.0.6+1.8.9.jar" \
            "META-INF/jars/AxolotlClient-3.0.6.jar" "META-INF/jars/AxolotlClient-config-2.1.13+1.8.9.jar" -d libs
          unzip -j -o "libs/AxolotlClient-config-2.1.13+1.8.9.jar" \
            "META-INF/jars/AxolotlClientConfig-common-2.1.13.jar" -d libs

      - name: Build and run the unit tests
        run: |
          chmod +x gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: axolotl-extras-${{ github.sha }}
          path: build/libs/*.jar
